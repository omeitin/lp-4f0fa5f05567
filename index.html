<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--red:#dc2626;--navy:#1e3a8a}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--ink:#e2e8f0;--mute:#94a3b8;--line:#1f2a40}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 20px 18px}
header h1{margin:0;font-size:26px;letter-spacing:-.02em}
header .sub{opacity:.85;font-size:14px;margin-top:2px}
.stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.15);border-radius:12px;padding:8px 12px;font-size:13px}
.stat b{display:block;font-size:20px}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px;display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.f .dot{width:9px;height:9px;border-radius:50%}
.f.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:860px;margin:0 auto;padding:8px 16px 40px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:22px 4px 8px;display:flex;justify-content:space-between}
h2 .n{font-weight:500}
section.missing h2{color:var(--red)}
.list{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
section.missing .list{border:2px solid var(--red);background:color-mix(in srgb,var(--red) 6%,var(--card))}
a.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
a.row:first-child{border-top:0}
a.row:active{background:var(--line)}
.bar{width:5px;align-self:stretch;border-radius:3px;flex:0 0 5px}
.mid{flex:1;min-width:0}
.title{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:2px 8px}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:6px;padding:2px 7px;background:var(--line);color:var(--mute)}
.badge.Test{background:#dc2626;color:#fff}
.badge.Quiz{background:#f59e0b;color:#1f1300}
.badge.Project\/Lab{background:#ddd6fe;color:#4c1d95}
.row.big .title{font-size:17px}
.row.big{background:linear-gradient(90deg,rgba(245,158,11,.10),transparent 60%)}
.row.big.t-Test{background:linear-gradient(90deg,rgba(220,38,38,.12),transparent 60%)}
.time{text-align:right;font-size:14px;font-weight:600;white-space:nowrap}
.time small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.go{color:var(--mute);font-size:20px}
details.other{margin-top:22px}
details.other summary{cursor:pointer;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 4px 8px;list-style:none}
details.other summary::before{content:"▸ "}
details.other[open] summary::before{content:"▾ "}
.empty{padding:16px;color:var(--mute);text-align:center}
footer{text-align:center;color:var(--mute);font-size:12px;padding:10px 16px 30px}
footer a{color:inherit}
@media (min-width:700px){header{padding-left:32px;padding-right:32px}header h1{font-size:30px}}
</style>
</head>

<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const TZ=D.timezone;
const fmtDayKey=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
const fmtDay=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short',month:'short',day:'numeric'});
const fmtTime=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'});
const fmtUpd=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const key=d=>fmtDayKey.format(d);
const now=new Date();
const todayK=key(now), tomK=key(new Date(now.getTime()+864e5));
document.getElementById('upd').textContent=fmtUpd.format(new Date(D.updated));
const subj={};D.subjects.forEach(s=>subj[s.key]=s);
let filter=localStorage.getItem('planner-filter')||'all';
const items=D.items.map(i=>Object.assign({},i,{d:i.due?new Date(i.due):null}));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function row(i,missing){
  const big=(i.type==='Test'||i.type==='Quiz');
  let t='';
  if(missing){t=i.d?'<small>was due</small>'+fmtDay.format(i.d):'<small>no date</small>Missing';}
  else t=(i.all_day?'11:59 PM':fmtTime.format(i.d))+'<small>'+(i.all_day?'end of day':'due')+'</small>';
  return `<a class="row ${big?'big':''} t-${i.type}" href="${esc(i.url)}" target="_blank" rel="noopener">
   <div class="bar" style="background:${i.color}"></div>
   <div class="mid"><div class="title">${esc(i.title)}</div>
    <div class="meta"><span class="chip" style="background:${i.color}">${esc(i.subject)}</span><span class="badge ${i.type}">${esc(i.type)}</span></div></div>
   <div class="time">${t}</div><div class="go">›</div></a>`;
}
function section(title,list,cls){
  return `<section class="${cls||''}"><h2><span>${title}</span><span class="n">${list.length}</span></h2><div class="list">${list.map(i=>row(i,cls==='missing')).join('')}</div></section>`;
}
function render(){
  const show=i=>filter==='all'?i.primary:(filter==='other'?!i.primary:i.subject_key===filter);
  const vis=items.filter(show);
  const missing=vis.filter(i=>i.status==='missing');
  const up=vis.filter(i=>i.status!=='missing'&&i.d&&i.d>=now).sort((a,b)=>a.d-b.d);
  let h='';
  if(missing.length)h+=section('⚠️ Missing',missing,'missing');
  const days={};up.forEach(i=>{(days[key(i.d)]=days[key(i.d)]||[]).push(i)});
  const ks=Object.keys(days).sort();
  if(!ks.length)h+='<section><h2>Upcoming</h2><div class="list"><div class="empty">Nothing due in the next 3 weeks 🎉</div></div></section>';
  ks.forEach(k=>{const lbl=k===todayK?'Today':k===tomK?'Tomorrow':fmtDay.format(days[k][0].d);h+=section(lbl,days[k])});
  if(filter==='all'){
    const oth=items.filter(i=>!i.primary&&(i.status==='missing'||(i.d&&i.d>=now))).sort((a,b)=>(a.status==='missing'?0:1)-(b.status==='missing'?0:1)||((a.d||0)-(b.d||0)));
    if(oth.length)h+=`<details class="other"><summary>Other (PE, clubs) · ${oth.length}</summary><div class="list">${oth.map(i=>row(i,i.status==='missing')).join('')}</div></details>`;
  }
  document.getElementById('main').innerHTML=h;
  const prim=items.filter(i=>i.primary&&i.status!=='missing'&&i.d&&i.d>=now);
  const wk=new Date(now.getTime()+7*864e5);
  document.getElementById('stats').innerHTML=
   `<div class="stat"><b>${items.filter(i=>i.primary&&i.status==='missing').length}</b>missing</div>`+
   `<div class="stat"><b>${prim.filter(i=>i.d<wk).length}</b>due this week</div>`+
   `<div class="stat"><b>${prim.filter(i=>i.type==='Test').length}</b>tests</div>`+
   `<div class="stat"><b>${prim.filter(i=>i.type==='Quiz').length}</b>quizzes</div>`;
  document.querySelectorAll('.f').forEach(b=>b.classList.toggle('on',b.dataset.k===filter));
}
const fl=[{key:'all',name:'All classes'}].concat(D.subjects.filter(s=>s.primary)).concat([{key:'other',name:'Other',color:'#78716c'}]);
document.getElementById('filters').innerHTML=fl.map(s=>`<button class="f" data-k="${s.key}">${s.color?`<span class="dot" style="background:${s.color}"></span>`:''}${esc(s.name)}</button>`).join('');
document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('.f');if(!b)return;filter=b.dataset.k;localStorage.setItem('planner-filter',filter);render();window.scrollTo({top:0,behavior:'smooth'})});
render();
setInterval(render,5*60*1000);
})();
</script>
